name: ci

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - run: bash -n scripts/deploy.sh
      - run: |
          set -euo pipefail
          test -f logstash/pipeline/csv.conf
          test -f logstash/pipeline/json.conf
          test ! -f logstash/pipeline/06-uploads-to-es.conf
          grep -q "pipeline.id: uploads-csv" logstash/config/pipelines.yml
          grep -q "pipeline.id: uploads-json" logstash/config/pipelines.yml
          ! grep -q "^path.config:" logstash/config/logstash.yml
          test -f app/api/search.py
          test -f app/services/elasticsearch_search.py
          test -f app/services/search_history.py
          test -f app/services/elasticsearch_client.py
          grep -q 'threshold_breached' elasticsearch/templates/logs-alertes.json
          grep -q 'threshold_breached' elasticsearch/templates/logs-occupation.json
          grep -q 'api_v1_search' app/app.py
          grep -q '@api_v1_search.get("/search")' app/api/search.py
          grep -q '@api_v1_search.get("/history")' app/api/search.py
      - run: |
          set -euo pipefail
          python scripts/generate_logs.py --sensors 20 --hours 1 --seed 0 --format json --out /tmp/elk-ci-logs
          test "$(find /tmp/elk-ci-logs -name '*.json' | wc -l)" -eq 5

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
