name: ci

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - run: python scripts/check_api_contract.py
      - run: bash -n scripts/deploy.sh
      - run: |
          set -euo pipefail
          test -f logstash/pipeline/csv.conf
          test -f logstash/pipeline/json.conf
          test ! -f logstash/pipeline/06-uploads-to-es.conf
          grep -q "pipeline.id: uploads-csv" logstash/config/pipelines.yml
          grep -q "pipeline.id: uploads-json" logstash/config/pipelines.yml
          ! grep -q "^path.config:" logstash/config/logstash.yml
          test -f app/api/search.py
          test -f app/services/elasticsearch_search.py
          test -f app/services/search_history.py
          test -f app/services/elasticsearch_client.py
          test -f app/api/errors.py
          test -f app/api/schemas.py
          test -f scripts/check_api_contract.py
          test -f app/api/dashboard.py
          test -f app/services/dashboard_stats.py
          test -f app/utils/cache.py
          test -f app/templates/base.html
          test -f app/templates/index.html
          test -f app/templates/upload.html
          test -f app/templates/search.html
          test -f app/templates/results.html
          test -f app/templates/404.html
          test -f app/static/css/app.css
          test -f app/static/js/app.js
          test -f app/static/favicon.svg
          test ! -f app/templates/privacy.html
          test ! -f app/templates/terms.html
          test -f deploy/nginx.conf.template
          test -f kibana/saved_objects/elk-dashboard.ndjson
          test -f kibana/import_dashboard.sh
          grep -q 'APIFlask' app/app.py
          grep -q 'VALIDATION_ERROR_STATUS_CODE' app/app.py
          grep -q 'ERROR_SCHEMA' app/app.py
          grep -q 'fuzziness' app/services/elasticsearch_search.py
          grep -q 'date-time' app/api/schemas.py
          grep -q 'SWAGGER_UI_CONFIG' app/app.py
          grep -q 'showOpenFilePicker' app/app.py
          grep -q 'excludeAcceptAllOption' app/app.py
          grep -q 'datetime-local' app/app.py
          grep -q 'no-store' app/app.py
          grep -q '"example": "temperatur"' app/api/schemas.py
          grep -q 'api_v1_dashboard' app/app.py
          grep -q 'redis==5.2.1' requirements.txt
          grep -q 'DEFAULT_PERIOD = "7d"' app/services/dashboard_stats.py
          grep -q 'MAX_CUSTOM_SECONDS = 90 \* 24 \* 3600' app/services/dashboard_stats.py
          grep -q 'def resolve_period' app/services/dashboard_stats.py
          grep -q 'def _interval_for_seconds' app/services/dashboard_stats.py
          grep -q 'elk:kpi:v3:' app/services/dashboard_stats.py
          grep -q '"fixed_interval": spec\["interval"\]' app/services/dashboard_stats.py
          grep -q '"min_doc_count": 0' app/services/dashboard_stats.py
          grep -q '"global_avg"' app/services/dashboard_stats.py
          grep -q '"last_reading"' app/services/dashboard_stats.py
          grep -q 'latest_prediction_per_equipment' app/services/dashboard_stats.py
          grep -q 'critical_alerts_24h' app/static/js/app.js
          grep -q 'total_kwh' app/static/js/app.js
          grep -q 'formatAge' app/static/js/app.js
          grep -q 'dashboardParamsFromControls' app/static/js/app.js
          grep -q 'initUploadHistory' app/static/js/app.js
          grep -q 'chartInstances' app/static/js/app.js
          grep -q 'cleanLabel' app/static/js/app.js
          grep -q 'dashboard-period-form' app/templates/index.html
          grep -q 'dashboard-period-summary' app/templates/index.html
          grep -q 'dashboard-custom-range' app/templates/index.html
          grep -q 'upload-history-list' app/templates/upload.html
          grep -q 'kpi-energy-detail' app/templates/index.html
          grep -q 'document(s)' app/static/js/app.js
          grep -q 'setFieldError' app/static/js/app.js
          grep -q 'renderChartData' app/static/js/app.js
          grep -q 'MAX_UPLOAD_BYTES' app/static/js/app.js
          grep -q 'chart-empty-message' app/static/js/app.js
          grep -q 'Aucun document pour ces critères.' app/static/js/app.js
          grep -q 'class="skip-link"' app/templates/base.html
          grep -q 'id="main-content"' app/templates/base.html
          grep -q 'dashboard-retry' app/templates/index.html
          grep -q 'chart-occupancy-data' app/templates/index.html
          grep -q 'suggest-status' app/templates/search.html
          grep -q 'date-error' app/templates/search.html
          grep -q 'results-retry' app/templates/results.html
          grep -q 'aria-valuetext' app/templates/upload.html
          grep -q '.skip-link' app/static/css/app.css
          grep -q 'prefers-reduced-motion' app/static/css/app.css
          ! grep -Rqi 'temps réel' app/templates app/static/js/app.js kibana/saved_objects README.md docs
          ! grep -Rq 'résultat(s)' app/templates app/static/js/app.js
          ! grep -Rq 'occurrence(s)' app/templates app/static/js/app.js
          ! grep -Rq 'Alertes critiques par jour' kibana/saved_objects README.md docs
          ! grep -Rq 'Énergie temps réel' kibana/saved_objects README.md docs
          ! grep -Rq 'énergie kWh 1 min' kibana/saved_objects README.md docs
          grep -q 'text/csv' app/api/dashboard.py
          grep -q 'XMLHttpRequest' app/static/js/app.js
          bash -n kibana/import_dashboard.sh
          bash -n kibana/setup_data_view.sh
          python -c "import json,pathlib; [json.loads(line) for line in pathlib.Path('kibana/saved_objects/elk-dashboard.ndjson').read_text().splitlines()]"
          python scripts/check_kibana_dashboard.py
          grep -q 'threshold_breached' elasticsearch/templates/logs-alertes.json
          grep -q 'threshold_breached' elasticsearch/templates/logs-occupation.json
          grep -q 'api_v1_search' app/app.py
          grep -q '@api_v1_search.get("/search")' app/api/search.py
          grep -q '@api_v1_search.get("/history")' app/api/search.py
          grep -q '@api_v1_search.get("/suggest")' app/api/search.py
          grep -q '/api/v1/suggest' app/static/js/app.js
          grep -q 'AbortController' app/static/js/app.js
          grep -q 'aria-activedescendant' app/static/js/app.js
          grep -q 'rel="icon"' app/templates/base.html
          ! grep -q 'href="/privacy"' app/templates/base.html
          ! grep -q 'href="/terms"' app/templates/base.html
          ! grep -q 'brand-mark' app/templates/base.html
          ! grep -q 'brand-mark' app/static/css/app.css
          ! grep -Rq 'n/d' app/templates/index.html app/templates/results.html app/templates/upload.html
          grep -q 'PUBLIC_BASE_URL' .env.example
          grep -q 'PUBLIC_DOMAIN' docker-compose.yml
          grep -q 'color-scheme: light' app/static/css/app.css
          grep -q -- '--elk-surface' app/static/css/app.css
          grep -q -- '--elk-radius-card' app/static/css/app.css
          grep -q '.status-dot' app/static/css/app.css
          grep -q 'updateAlertState' app/static/js/app.js
          grep -q 'alert-status-global' app/templates/base.html
          ! grep -q 'backdrop-filter' app/static/css/app.css
          ! grep -Rq 'gradient(' app/templates app/static/css
          ! grep -Rqi 'purple' app/templates app/static/css
          ! grep -Rq 'rounded-pill' app/templates app/static/css
          ! grep -Rq 'Made with AI' app/templates app/static
          ! grep -Rq '⇪' app/templates
          ! grep -Rq '—' app/templates app/static/js/app.js app/app.py
          grep -qF '.chart-wrap:not(.chart-empty) .chart-empty-message' app/static/css/app.css
          grep -qF 'white-space: nowrap' app/static/css/app.css
          grep -qF '"label": "7j"' app/services/dashboard_stats.py
          ! grep -qF "'7 j'" app/static/js/app.js
          grep -qF '\u00A0j' app/static/js/app.js
          ! grep -qF 'Get Started' app/templates/index.html
          grep -qF 'kibana/setup_data_view.sh' scripts/deploy.sh
          grep -qF 'kibana/import_dashboard.sh' scripts/deploy.sh
      - run: |
          set -euo pipefail
          python scripts/generate_logs.py --sensors 20 --hours 1 --seed 0 --format json --out /tmp/elk-ci-logs
          test "$(find /tmp/elk-ci-logs -name '*.json' | wc -l)" -eq 5

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
