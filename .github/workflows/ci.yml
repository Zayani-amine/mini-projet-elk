name: ci

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - run: python scripts/check_api_contract.py
      - run: bash -n scripts/deploy.sh
      - run: |
          set -euo pipefail
          test -f logstash/pipeline/csv.conf
          test -f logstash/pipeline/json.conf
          test ! -f logstash/pipeline/06-uploads-to-es.conf
          grep -q "pipeline.id: uploads-csv" logstash/config/pipelines.yml
          grep -q "pipeline.id: uploads-json" logstash/config/pipelines.yml
          ! grep -q "^path.config:" logstash/config/logstash.yml
          test -f app/api/search.py
          test -f app/services/elasticsearch_search.py
          test -f app/services/search_history.py
          test -f app/services/elasticsearch_client.py
          test -f app/api/errors.py
          test -f app/api/schemas.py
          test -f scripts/check_api_contract.py
          test -f app/api/dashboard.py
          test -f app/services/dashboard_stats.py
          test -f app/utils/cache.py
          test -f app/templates/base.html
          test -f app/templates/index.html
          test -f app/templates/upload.html
          test -f app/templates/search.html
          test -f app/templates/results.html
          test -f app/templates/404.html
          test -f app/static/css/app.css
          test -f app/static/js/app.js
          test -f kibana/saved_objects/elk-dashboard.ndjson
          test -f kibana/import_dashboard.sh
          grep -q 'APIFlask' app/app.py
          grep -q 'VALIDATION_ERROR_STATUS_CODE' app/app.py
          grep -q 'ERROR_SCHEMA' app/app.py
          grep -q 'fuzziness' app/services/elasticsearch_search.py
          grep -q 'date-time' app/api/schemas.py
          grep -q 'SWAGGER_UI_CONFIG' app/app.py
          grep -q 'showOpenFilePicker' app/app.py
          grep -q 'excludeAcceptAllOption' app/app.py
          grep -q 'datetime-local' app/app.py
          grep -q 'no-store' app/app.py
          grep -q '"example": "temperatur"' app/api/schemas.py
          grep -q 'api_v1_dashboard' app/app.py
          grep -q 'redis==5.2.1' requirements.txt
          grep -q 'elk:kpi:energy_realtime' app/services/dashboard_stats.py
          grep -q 'text/csv' app/api/dashboard.py
          grep -q 'XMLHttpRequest' app/static/js/app.js
          bash -n kibana/import_dashboard.sh
          python -c "import json,pathlib; [json.loads(line) for line in pathlib.Path('kibana/saved_objects/elk-dashboard.ndjson').read_text().splitlines()]"
          grep -q 'threshold_breached' elasticsearch/templates/logs-alertes.json
          grep -q 'threshold_breached' elasticsearch/templates/logs-occupation.json
          grep -q 'api_v1_search' app/app.py
          grep -q '@api_v1_search.get("/search")' app/api/search.py
          grep -q '@api_v1_search.get("/history")' app/api/search.py
      - run: |
          set -euo pipefail
          python scripts/generate_logs.py --sensors 20 --hours 1 --seed 0 --format json --out /tmp/elk-ci-logs
          test "$(find /tmp/elk-ci-logs -name '*.json' | wc -l)" -eq 5

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
