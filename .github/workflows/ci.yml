name: ci

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - run: bash -n scripts/deploy.sh
      - run: |
          set -euo pipefail
          python scripts/generate_logs.py --sensors 20 --hours 1 --seed 0 --format json --out /tmp/elk-ci-logs
          test "$(find /tmp/elk-ci-logs -name '*.json' | wc -l)" -eq 5

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
