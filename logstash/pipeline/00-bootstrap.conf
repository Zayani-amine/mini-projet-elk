input {
  file {
    path => "/usr/share/logstash/inbox/*"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_bootstrap"
  }
}

filter {
  mutate {
    add_field => { "bootstrap" => "true" }
  }
}

output {
  stdout {
    codec => rubydebug { metadata => false }
  }
}
