input {
  file {
    path => "/usr/share/logstash/inbox/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_bootstrap"
    add_field => { "[@metadata][pipeline]" => "bootstrap" }
  }
}

filter {
  if [@metadata][pipeline] == "bootstrap" {
    mutate {
      add_field => { "bootstrap" => "true" }
    }
  }
}

output {
  if [@metadata][pipeline] == "bootstrap" {
    stdout {
      codec => rubydebug { metadata => false }
    }
  }
}
