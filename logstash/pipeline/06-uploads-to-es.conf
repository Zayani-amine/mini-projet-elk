input {
  file {
    path => "/usr/share/logstash/inbox/uploads/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_uploads_json"
    codec => json {
      ecs_compatibility => disabled
    }
    ecs_compatibility => disabled
    add_field => { "[@metadata][pipeline]" => "uploads_json" "[@metadata][source_format]" => "json" }
  }
  file {
    path => "/usr/share/logstash/inbox/uploads/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_uploads_csv"
    codec => plain
    ecs_compatibility => disabled
    add_field => { "[@metadata][pipeline]" => "uploads_csv" "[@metadata][source_format]" => "csv" }
  }
  file {
    path => "/usr/share/logstash/inbox/uploads/*.txt"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_uploads_txt"
    codec => plain
    ecs_compatibility => disabled
    add_field => { "[@metadata][pipeline]" => "uploads_txt" "[@metadata][source_format]" => "txt" }
  }
}

filter {
  if [@metadata][source_format] =~ /^(csv|txt)$/ {
    mutate {
      strip => ["message"]
    }
  }
  if [@metadata][source_format] == "csv" {
    csv {
      source => "message"
      separator => ","
      autodetect_column_names => true
      skip_header => true
      target => "[parsed]"
      convert => {
        "floor" => "integer"
        "value" => "float"
        "threshold" => "float"
        "threshold_breached" => "boolean"
        "wear_level" => "float"
        "predicted_failure" => "boolean"
        "quantity" => "float"
        "present_count" => "integer"
        "capacity" => "integer"
        "occupancy_rate" => "float"
      }
      ecs_compatibility => disabled
    }
  }
  if [@metadata][source_format] == "txt" {
    csv {
      source => "message"
      separator => "|"
      autodetect_column_names => true
      skip_header => true
      target => "[parsed]"
      convert => {
        "floor" => "integer"
        "value" => "float"
        "threshold" => "float"
        "threshold_breached" => "boolean"
        "wear_level" => "float"
        "predicted_failure" => "boolean"
        "quantity" => "float"
        "present_count" => "integer"
        "capacity" => "integer"
        "occupancy_rate" => "float"
      }
      ecs_compatibility => disabled
    }
  }
  if [@metadata][pipeline] =~ /^uploads_/ {
    ruby {
      code => '
        source = event.get("path")
        event.set("source_file_id", source ? File.basename(source, File.extname(source)) : "unknown")
        event.set("source_format", event.get("[@metadata][source_format]"))
        parsed = event.get("[parsed]")
        if parsed
          parsed.each do |key, value|
            if key == "@timestamp"
              begin
                event.set("@timestamp", LogStash::Timestamp.new(value.to_s))
              rescue ArgumentError
                event.tag("_timestampparsefailure")
              end
            else
              event.set(key, value)
            end
          end
          event.remove("[parsed]")
        end
        event.remove("path")
        event.remove("message")
        event.set("ingested_at", LogStash::Timestamp.now.to_s)
      '
    }
  }
}

output {
  if [@metadata][pipeline] =~ /^uploads_/ {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS}"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "logs-%{[log_type]}"
      manage_template => false
      ilm_enabled => false
    }
  }
}
