input {
  file {
    path => "/usr/share/logstash/inbox/uploads/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_uploads_json"
    codec => json {
      ecs_compatibility => disabled
    }
    ecs_compatibility => disabled
    add_field => { "[@metadata][pipeline]" => "uploads_json" "[@metadata][source_format]" => "json" }
  }
}

filter {
  if [@metadata][pipeline] == "uploads_json" {
    ruby {
      code => '
        source = event.get("path")
        event.set("source_file_id", source ? File.basename(source, File.extname(source)) : "unknown")
        event.set("source_format", event.get("[@metadata][source_format]"))
        event.set("ingested_at", LogStash::Timestamp.now.to_s)

        tags = event.get("tags") || []
        tags = [tags] unless tags.is_a?(Array)
        errors = tags.select { |tag| tag.to_s.start_with?("_") }

        parsed = event.get("[parsed]")
        if parsed.is_a?(Hash)
          parsed.each do |key, value|
            if key == "@timestamp"
              begin
                event.set("@timestamp", LogStash::Timestamp.new(value.to_s))
              rescue ArgumentError
                errors << "_timestampparsefailure"
              end
            else
              event.set(key, value)
            end
          end
          event.remove("[parsed]")
        end

        to_bool = lambda do |value|
          return value if value == true || value == false
          text = value.to_s.strip.downcase
          return true if ["true", "1", "yes"].include?(text)
          return false if ["false", "0", "no"].include?(text)
          nil
        end

        to_number = lambda do |value|
          return nil if value.nil? || value.to_s.strip.empty?
          Float(value)
        rescue ArgumentError, TypeError
          nil
        end

        set_threshold = lambda do |field, breached|
          return if breached.nil?
          event.set(field, breached) if to_bool.call(event.get(field)).nil?
        end

        log_type = event.get("log_type").to_s

        require_number = lambda do |field|
          if to_number.call(event.get(field)).nil?
            errors << "_numericfieldfailure" unless errors.include?("_numericfieldfailure")
          end
        end

        case log_type
        when "capteurs"
          require_number.call("value")
          limits = { "temperature" => 26.0, "humidity" => 65.0, "co2" => 1000.0 }
          limit = limits[event.get("measure").to_s]
          value = to_number.call(event.get("value"))
          set_threshold.call("threshold_breached", !limit.nil? && !value.nil? && value > limit) unless limit.nil?
        when "alertes"
          require_number.call("value")
          require_number.call("threshold")
          value = to_number.call(event.get("value"))
          limit = to_number.call(event.get("threshold"))
          set_threshold.call("threshold_breached", !value.nil? && !limit.nil? && value > limit)
        when "energie"
          require_number.call("quantity")
          quantity = to_number.call(event.get("quantity"))
          set_threshold.call("threshold_breached", !quantity.nil? && quantity > 100.0)
        when "maintenance"
          require_number.call("wear_level")
          wear = to_number.call(event.get("wear_level"))
          set_threshold.call("predicted_failure", !wear.nil? && wear > 75.0)
        when "occupation"
          require_number.call("present_count")
          require_number.call("capacity")
          require_number.call("occupancy_rate")
          rate = to_number.call(event.get("occupancy_rate"))
          set_threshold.call("threshold_breached", !rate.nil? && rate > 80.0)
        end

        raw = event.get("message")
        event.set("raw_message", raw.to_s) if errors.any? && raw

        event.remove("path")
        event.remove("message")

        if errors.any?
          event.set("[@metadata][ingest_error]", "yes")
          event.set("error_type", errors.uniq.join(","))
          event.set("error_message", "Ingest validation failed: " + errors.uniq.join(", "))
        else
          event.set("[@metadata][ingest_error]", "no")
        end
      '
    }
  }
}

output {
  if [@metadata][pipeline] == "uploads_json" {
    if [@metadata][ingest_error] == "yes" {
      elasticsearch {
        hosts => ["${ELASTICSEARCH_HOSTS}"]
        user => "${ELASTICSEARCH_USER}"
        password => "${ELASTICSEARCH_PASSWORD}"
        index => "ingest-errors"
        manage_template => false
        ilm_enabled => false
      }
    } else {
      elasticsearch {
        hosts => ["${ELASTICSEARCH_HOSTS}"]
        user => "${ELASTICSEARCH_USER}"
        password => "${ELASTICSEARCH_PASSWORD}"
        index => "sb-logs-%{[log_type]}-%{+YYYY.MM}"
        manage_template => false
        ilm_enabled => false
      }
    }
  }
}
