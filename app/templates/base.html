<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Building IoT{% endblock %} · Mini-Projet ELK</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="canonical" href="{{ public_base_url }}{{ request.path }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <span id="alert-status-global" class="visually-hidden" role="status" aria-atomic="true"></span>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/"><span class="brand-mark">ELK</span> Smart Building</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Afficher le menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/' else '' }}" href="/">Accueil</a></li>
          <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/upload' else '' }}" href="/upload">Upload</a></li>
          <li class="nav-item"><a class="nav-link {{ 'active' if request.path in ('/search', '/results') else '' }}" href="/search">Recherche</a></li>
          <li class="nav-item"><a id="alerts-shortcut" class="nav-link d-flex align-items-center gap-2" href="/search?log_type=alertes&amp;severity=critical">Alertes <span id="nav-alert-dot" class="status-dot d-none" aria-hidden="true"></span></a></li>
          <li class="nav-item"><a class="nav-link" href="/docs" target="_blank" rel="noopener">API docs</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ kibana_url }}" target="_blank" rel="noopener">Kibana</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container flex-grow-1 py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer mt-auto py-3 glass-surface">
    <div class="container d-flex flex-wrap justify-content-between gap-2 small text-muted">
      <span>Mini-Projet ELK · Smart Building IoT</span>
      <span>
        <a href="/privacy" class="link-secondary">Confidentialité</a>
        <span aria-hidden="true">·</span>
        <a href="/terms" class="link-secondary">Conditions d'utilisation</a>
      </span>
      <span>Elasticsearch · Logstash · Kibana · MongoDB · Redis</span>
    </div>
  </footer>
</body>
</html>
